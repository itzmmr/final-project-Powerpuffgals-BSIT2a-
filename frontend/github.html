<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Projects - NEXUSWrites</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a535c">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/github.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-lg-5">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="dashboard.html" style="text-decoration:none;">
            <div class="logo-box me-2"></div>
            <span class="nexus-brand">NEXUS</span><span class="writes-brand">Writes</span>
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <div class="dropdown">
                <button class="btn text-white p-0 position-relative" data-bs-toggle="dropdown">
                    <i class="fas fa-bell fs-4"></i>
                    <span id="nav-notification-badge"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="display:none; font-size:0.6rem;">0</span>
                </button>
                <div class="dropdown-menu dropdown-menu-end shadow p-3 rounded-4" style="width:300px;">
                    <h6 class="fw-bold">Notifications</h6>
                    <hr>
                    <div id="dropdown-notification-list">
                        <p class="small text-muted text-center">No new notifications.</p>
                    </div>
                </div>
            </div>
            <div class="nav-item">
                <a class="nav-link d-flex align-items-center text-white" href="profile.html">
                    <i class="fas fa-user-circle fs-3"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- LAYOUT -->
<div class="d-flex" style="min-height:calc(100vh - 70px);">

    <!-- SIDEBAR -->
    <aside class="sidebar-left">
        <a href="homesearch.html" class="fb-icon-item"><i class="fas fa-search"></i></a>
        <a href="dashboard.html"  class="fb-icon-item"><i class="fas fa-home"></i></a>
        <a href="following.html"  class="fb-icon-item"><i class="fas fa-user-check"></i></a>
        <a href="github.html"     class="fb-icon-item active-link"><i class="fab fa-github"></i></a>
        <a href="settings.html"   class="fb-icon-item"><i class="fas fa-sliders-h"></i></a>
        <div class="mt-auto">
            <a href="javascript:void(0)" class="fb-icon-item" onclick="showLogoutModal()">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content-wrapper">
        <div class="container-fluid" style="max-width:1200px; width:100%;">
            <div class="content-card">

                <div class="text-center mb-5">
                    <div class="bg-info bg-opacity-10 d-inline-block p-3 rounded-circle mb-3">
                        <i class="fab fa-github fa-2x" style="color:#17a2b8"></i>
                    </div>
                    <h2 class="fw-bold" id="pageHeader">GitHub Projects</h2>
                    <p class="text-muted">Manage your public repositories and platform experience.</p>
                </div>

                <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden"
                     style="max-width:600px; margin:0 auto;">
                    <input type="text" id="githubUsername"
                           class="form-control border-0 ps-4"
                           placeholder="Enter GitHub username…">
                    <button class="btn btn-nexus-primary px-4" onclick="fetchGitHubRepos()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div id="github-content" class="py-3 section-highlight rounded-4">
                    <p class="text-center text-secondary fw-medium">
                        Enter a username above to fetch public repositories.
                    </p>
                </div>

                <div class="text-center mt-5">
                    <button class="btn btn-nexus-primary px-5 shadow-sm"
                            onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-home me-2"></i> Return to Feed
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>


<!-- ══ MODAL 1: Sync Success ══ -->
<div class="modal fade" id="syncSuccessModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div style="height:5px; background:linear-gradient(90deg,#1a535c,#4ecdc4);"></div>
            <div class="modal-body p-5 text-center">
                <i class="fas fa-sync fa-spin fa-3x mb-3" style="color:#4ecdc4;"></i>
                <h4 class="fw-bold" style="color:#1a535c; font-family:'Montserrat',sans-serif;">
                    Syncing Profile
                </h4>
                <p id="syncModalMessage" class="fs-6 text-muted mb-0 mt-2"></p>
                <div class="mt-4">
                    <div class="spinner-border spinner-border-sm text-secondary opacity-50" role="status"></div>
                    <span class="small text-muted ms-2">Redirecting to profile…</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ══ MODAL 2: Themed Alert ══ -->
<div class="modal fade" id="nexusAlertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:360px;">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header border-0 px-4 py-3 d-flex align-items-center justify-content-between"
                 style="background-color:#1a535c;">
                <div class="d-flex align-items-center gap-2">
                    <i id="nexusAlertIcon" class="fas fa-info-circle me-2"
                       style="color:#4ecdc4; font-size:1rem;"></i>
                    <span id="nexusAlertTitle" class="fw-bold text-white"
                          style="font-family:'Montserrat',sans-serif; font-size:1rem;">Notice</span>
                </div>
                <button type="button" class="btn p-0 lh-1" data-bs-dismiss="modal"
                        style="color:#ffffffaa; font-size:1.3rem; background:none; border:none;">&times;</button>
            </div>
            <div class="modal-body px-4 py-4 text-center" style="background:#fff;">
                <p id="nexusAlertMessage" class="mb-0 text-dark"
                   style="font-size:0.95rem; font-family:'Inter',sans-serif; line-height:1.5;"></p>
            </div>
            <div class="modal-footer border-0 px-4 pb-4 pt-0 justify-content-center"
                 style="background:#fff;">
                <button type="button" class="btn px-5 rounded-3 text-white" data-bs-dismiss="modal"
                        style="background-color:#1a535c; font-family:'Inter',sans-serif; font-size:0.875rem;">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ══ MODAL 3: Logout Confirm ══ -->
<div class="modal fade" id="nexusLogoutModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:360px;">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header border-0 px-4 py-3 d-flex align-items-center justify-content-between"
                 style="background-color:#1a535c;">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-sign-out-alt" style="color:#fff; font-size:1rem;"></i>
                    <span class="fw-bold text-white"
                          style="font-family:'Montserrat',sans-serif; font-size:1rem;">Log Out</span>
                </div>
                <button type="button" class="btn p-0 lh-1" data-bs-dismiss="modal"
                        style="color:#ffffffaa; font-size:1.3rem; background:none; border:none;">&times;</button>
            </div>
            <div class="modal-body px-4 py-4 text-center" style="background:#fff;">
                <p class="mb-0 text-dark"
                   style="font-size:0.95rem; font-family:'Inter',sans-serif; line-height:1.5;">
                    Are you sure you want to log out of <strong>NEXUSWrites</strong>?
                </p>
            </div>
            <div class="modal-footer border-0 px-4 pb-4 pt-0 d-flex gap-2 justify-content-center"
                 style="background:#fff;">
                <button type="button" class="btn btn-outline-secondary px-4 rounded-3"
                        data-bs-dismiss="modal"
                        style="font-family:'Inter',sans-serif; font-size:0.875rem;">Cancel</button>
                <button type="button" class="btn px-4 rounded-3 text-white" onclick="logout()"
                        style="background-color:#1a535c; font-family:'Inter',sans-serif; font-size:0.875rem;">
                    <i class="fas fa-sign-out-alt me-1"></i> Log Out
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/github.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>

<!-- GitHub Alert Modal -->
<div class="modal fade" id="githubAlertModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
    <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white, #fff)">
      <div class="modal-header border-0 text-white py-2 px-3" style="background: #1a535c;">
        <h6 class="modal-title fw-bold mb-0"><i class="fas fa-exclamation-circle me-2"></i>Heads Up!</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-3 px-3 text-center">
        <p id="githubAlertMessage" class="mb-0" style="font-size:0.9rem;"></p>
      </div>
      <div class="modal-footer border-0 justify-content-center py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm px-4" data-bs-dismiss="modal">Got it</button>
      </div>
    </div>
  </div>
</div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('nexusLang') || 'English';
            if (typeof changeLanguage === 'function') {
                changeLanguage(savedLang);
            }
        });
    </script>

</body>
</html>
