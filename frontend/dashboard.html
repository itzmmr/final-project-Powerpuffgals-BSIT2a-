<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NEXUSWrites</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1a535c">

<link rel="apple-touch-icon" href="images/icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top" style="background-color: #1a535c;">
    <div class="container-fluid px-lg-5">
        <a class="navbar-brand d-flex align-items-center fw-bold" href="dashboard.html" style="text-decoration: none;">
            <div class="logo-box me-2"></div>
            <span class="nexus-brand" style="color: white;">NEXUS</span><span class="writes-brand" style="color: #4ecdc4;">Writes</span>
        </a>
        <div class="d-flex align-items-center gap-3">
<div class="dropdown">
    <button class="btn text-white p-0 position-relative" data-bs-toggle="dropdown">
        <i class="fas fa-bell fs-4"></i>
        <span id="nav-notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
              style="display:none; font-size: 0.6rem;">
            0
        </span>
    </button>
    <div class="dropdown-menu dropdown-menu-end shadow border-0 p-0 rounded-4" style="width: 320px; overflow: hidden;">
        <div class="p-3 border-bottom sticky-top dropdown-header-container">
            <h6 class="fw-bold mb-0" data-key="notifications">Notifications</h6>
        </div>
        
        <div id="dropdown-notification-list" style="max-height: 400px; overflow-y: auto; display: block;">
            <p class="small text-muted text-center p-4">No new notifications.</p>
        </div>

     <div class="p-2 text-center border-top notification-footer">
    <button type="button" 
            class="btn btn-link btn-sm text-decoration-none fw-bold text-teal w-100" 
            onclick="markAllAsRead()" 
            style="color: #1a535c !important; cursor: pointer;">
        Mark all as Read
    </button>
</div>
    </div>
</div>
            <div class="nav-item">
                <a class="nav-link d-flex align-items-center text-white" href="profile.html">
                    <i class="fas fa-user-circle fs-3"></i>
                </a>
            </div>
        </div>
    </div>
</nav>
<div class="container-fluid px-lg-5 flex-grow-1">
    <div class="row">
        <div class="col-lg-3">
            <aside class="sidebar-left">
                <a href="homesearch.html" class="fb-icon-item">
                    <i class="fas fa-search"></i>
                </a>

                <a href="dashboard.html" class="fb-icon-item active-link"><i class="fas fa-home"></i></a>
                <a href="following.html" class="fb-icon-item"><i class="fas fa-user-check"></i></a>
                <a href="github.html" class="fb-icon-item"><i class="fab fa-github"></i></a>
                <a href="settings.html" class="fb-icon-item"><i class="fas fa-sliders-h"></i></a>

                <div class="mt-auto">
                    <a href="javascript:void(0)" class="fb-icon-item" onclick="showLogoutModal()">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                </div>
            </aside>
        </div>

<div class="main-content-wrapper" style="margin-left: 80px; display: flex; flex-direction: column; align-items: center; width: calc(100% - 80px); padding: 40px;">
    <main class="feed-area mx-auto mt-2" style="max-width: 1200px; width: 100%;">

                <div class="card fb-card p-4 shadow-sm mb-4">
                    <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-user-circle fa-4x text-muted me-3"></i>
                        <div>
                            <h4 class="mb-0 fw-bold" id="feedUsername">Loading...</h4>
                            <p class="welcome-text-small text-muted mb-0" data-key="sharePrompt">What tutorial would you like to share today?</p>
                        </div>
                    </div>
                   <button class="fake-input w-100 text-start ps-3 py-2" onclick="openPostModal()">
                        <i class="fas fa-edit me-2 text-primary"></i> <span data-key="post">Post a tutorial...</span>
                    </button>
                </div>

                <div id="postsContainer"></div>

<div class="text-center mt-4 mb-5">
    <button id="loadMoreBtn" class="btn btn-nexus px-4 shadow-sm" onclick="loadMorePosts()">
        <i class="fas fa-sync-alt me-2"></i> Load More
    </button>
</div>
                
            </main>
        </div>
    </div>
</div>

<div class="modal fade" id="postModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white)">
            <div class="modal-header border-0 text-white" style="background: var(--nexus-teal)">
                <h5 class="modal-title fw-bold" id="modalTitle"><span data-key="createNew">Create New Tutorial</span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="postForm">
                    <input type="hidden" id="editPostId">
                    <div class="mb-3">
                        <label for="postTitle" class="form-label fw-bold" data-key="tutTitle">Tutorial Title</label>
                        <input type="text" class="form-control p-2" id="postTitle" placeholder="Enter an engaging title..." required>
                    </div>
                    <div class="mb-3">
                        <label for="postCategorySelect" class="form-label fw-bold">Category</label>
                        <div class="input-group">
                            <select class="form-select" id="postCategorySelect" onchange="checkCustomCategory(this)">
                                <option value="General" selected>General</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Mobile Apps">Mobile Apps</option>
                                <option value="AI & Machine Learning">AI & Machine Learning</option>
                                <option value="Data Science">Data Science</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Cloud Computing">Cloud Computing</option>
                                <option value="Blockchain">Blockchain</option>
                                <option value="IoT">Internet of Things</option>
                                <option value="OTHER">-- Input my own category --</option>
                            </select>
                            <input type="text" class="form-control d-none" id="postCategoryCustom" placeholder="Enter your category...">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="postContent" class="form-label fw-bold" data-key="tutContent">Content</label>
                        <textarea class="form-control p-2" id="postContent" rows="6" placeholder="Write your technical story here..." required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="postTags" class="form-label fw-bold" data-key="tutTags">Tags</label>
                            <input type="text" class="form-control" id="postTags" placeholder="e.g. JavaScript, AI, Design">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="postPhotoFile" class="form-label fw-bold">Add Image</label>
                            <input type="file" class="form-control" id="postPhotoFile" accept="image/*">
                            <div id="previewContainer" class="mt-2 d-none">
                                <img src="" id="filePreviewImg" style="width:100%; max-height:150px; object-fit:cover; border-radius:10px; border: 2px solid var(--nexus-cyan)">
                            </div>
                        </div>
                    </div>
                    <div class="text-end mt-3">
                        <button type="button" class="btn btn-nexus px-5 shadow-sm" onclick="handlePostSubmit()">
                            <i class="fas fa-paper-plane me-2"></i><span id="submitBtnText" data-key="publish">Publish</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/settings.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/notification.js"></script>

<div class="modal fade" id="nexusAlertModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
    <div class="modal-content border-0 shadow-lg rounded-3 overflow-hidden">
      <div class="d-flex align-items-center" style="background-color: #e03131; padding: 10px 14px;">
        <i class="fas fa-exclamation-triangle text-white me-2" style="font-size: 0.85rem;"></i>
        <span class="text-white fw-bold" style="font-size: 0.85rem; flex: 1;">Heads Up!</span>
        <button type="button" class="btn p-0 lh-1" data-bs-dismiss="modal" style="color: #ffffffaa; font-size: 1.1rem; background: none; border: none;">&times;</button>
      </div>
      <div class="d-flex align-items-center justify-content-between px-3 py-2" style="background: #fff; gap: 12px;">
        <p id="alertModalMessage" class="mb-0 text-dark" style="font-size: 0.9rem; line-height: 1.5;"></p>
        <button type="button" class="btn btn-secondary px-4 flex-shrink-0" data-bs-dismiss="modal" style="font-size: 0.85rem;">Got it</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="nexusConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title text-white">Confirmation</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <p id="confirmModalMessage" class="fs-5 mb-0"></p>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirmModalBtn" class="btn btn-danger px-4">Delete</button>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>

<!-- Custom Delete Confirm Modal -->
<div class="modal fade" id="nexusDeleteConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
    <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white)">
      <div class="modal-header border-0 text-white py-2 px-3" style="background: var(--nexus-teal)">
        <h6 class="modal-title fw-bold mb-0"><i class="fas fa-trash me-2"></i>Delete</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-2 px-3 text-center">
        <p id="nexusDeleteConfirmMessage" class="mb-0" style="font-size:0.9rem;"></p>
      </div>
      <div class="modal-footer border-0 justify-content-center gap-2 py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="nexusDeleteConfirmBtn" class="btn btn-danger btn-sm px-3">
          <i class="fas fa-trash me-1"></i>Delete
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Custom Edit Comment Modal -->
<div class="modal fade" id="nexusEditCommentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
    <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white)">
      <div class="modal-header border-0 text-white py-2 px-3" style="background: var(--nexus-teal)">
        <h6 class="modal-title fw-bold mb-0"><i class="fas fa-edit me-2"></i>Update your message</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-2 px-3">
        <textarea class="form-control p-2" id="editCommentTextarea" rows="3" style="border-radius: 8px; resize: none; font-size: 0.9rem;"></textarea>
      </div>
      <div class="modal-footer border-0 justify-content-end gap-2 py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="editCommentSaveBtn" class="btn btn-nexus btn-sm px-3">
          <i class="fas fa-paper-plane me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Logout Confirmation Modal -->
<div class="modal fade" id="nexusLogoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header border-0 px-4 py-3 d-flex align-items-center justify-content-between" style="background-color: #1a535c;">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-sign-out-alt" style="color: #fff; font-size: 1rem;"></i>
          <span class="fw-bold text-white" style="font-family: 'Montserrat', sans-serif; font-size: 1rem;">Log Out</span>
        </div>
        <button type="button" class="btn p-0 lh-1" data-bs-dismiss="modal" style="color: #ffffffaa; font-size: 1.3rem; background: none; border: none;">&times;</button>
      </div>
      <div class="modal-body px-4 py-4 text-center" style="background: #fff;">
        <p class="mb-0 text-dark" style="font-size: 0.95rem; font-family: 'Inter', sans-serif; line-height: 1.5;">
          Are you sure you want to log out of <strong>NEXUSWrites</strong>?
        </p>
      </div>
      <div class="modal-footer border-0 px-4 pb-4 pt-0 d-flex gap-2 justify-content-center" style="background: #fff;">
        <button type="button" class="btn btn-outline-secondary px-4 rounded-3" data-bs-dismiss="modal"
                style="font-family: 'Inter', sans-serif; font-size: 0.875rem;">Cancel</button>
        <button type="button" class="btn px-4 rounded-3 text-white" onclick="logoutUser()"
                style="background-color: #1a535c; font-family: 'Inter', sans-serif; font-size: 0.875rem;">
          <i class="fas fa-sign-out-alt me-1"></i> Log Out
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
