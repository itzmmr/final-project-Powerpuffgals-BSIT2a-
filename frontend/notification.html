<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | NexusWrites</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1a535c">

<link rel="apple-touch-icon" href="images/icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<div class="container mt-4 mt-sm-5">
    <div class="d-flex justify-content-between align-items-center notification-header mb-4">
        <h4 class="fw-bold" style="color: var(--nexus-teal);">
            <i class="fas fa-bell me-2"></i> Notifications
        </h4>
        <button class="btn btn-sm btn-outline-secondary rounded-pill btn-mark-read" onclick="markAllAsRead()">
            <i class="fas fa-check-double me-1"></i> Mark all as read
        </button>
    </div>

    <div class="notification-scroll-wrapper shadow-sm rounded-3 bg-white" 
         style="height: auto; min-height: 60vh; max-height: calc(100vh - 180px); overflow-y: auto; border: 1px solid #ddd;">
        
        <div id="notification-list" class="list-group list-group-flush">
            <div class="text-center p-5">
                <div class="spinner-border text-info" role="status"></div>
                <p class="mt-2 text-muted">Fetching your updates...</p>
            </div>
        </div>
    </div>
</div>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
     <script src="js/app.js"></script>
     
</body>
</html>
