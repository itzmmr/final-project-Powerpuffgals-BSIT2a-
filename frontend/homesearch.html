<!-- homesearch_8.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - NEXUSWrites</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a535c">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles/homesearch.css">
</head>
<body>

    <div class="search-nav">
        <a href="dashboard.html" class="back-icon"><i class="fas fa-arrow-left"></i></a>
        <div class="search-input-container">
            <i class="fas fa-search search-mute"></i>
            <input type="text" id="innerSearchInput" placeholder="Search tutorials..." oninput="handleInstantSuggestions(this.value)" autofocus autocomplete="off">
            <i class="fas fa-times-circle clear-x" id="clearBtn" onclick="clearInput()" style="display:none;"></i>
        </div>
        <button class="search-confirm">Search</button>
    </div>

    <div class="tab-scroller">
        <div class="search-tab active" onclick="switchTab(this, 'all')">Top</div>
        <div class="search-tab" onclick="switchTab(this, 'General')">General</div>
        <div class="search-tab" onclick="switchTab(this, 'Web Development')">Web Development</div>
        <div class="search-tab" onclick="switchTab(this, 'Mobile Apps')">Mobile Apps</div>
        <div class="search-tab" onclick="switchTab(this, 'AI & Machine Learning')">AI & Machine Learning</div>
        <div class="search-tab" onclick="switchTab(this, 'Data Science')">Data Science</div>
        <div class="search-tab" onclick="switchTab(this, 'UI/UX Design')">UI/UX Design</div>
        <div class="search-tab" onclick="switchTab(this, 'Cybersecurity')">Cybersecurity</div>
        <div class="search-tab" onclick="switchTab(this, 'Cloud Computing')">Cloud Computing</div>
        <div class="search-tab" onclick="switchTab(this, 'Blockchain')">Blockchain</div>
        <div class="search-tab" onclick="switchTab(this, 'Internet of Things')">Internet of Things</div>
    </div>

    <div id="suggestionBox" class="suggestion-floating-box shadow-sm"></div>

    <div class="container-fluid px-2 mt-3">
        <div class="row g-2" id="resultsGrid"></div>
    </div>

    <!-- Post Detail Modal -->
    <div class="modal fade" id="postDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
                <div class="modal-header border-0 pb-0">
                    <div id="modalPostHeader" class="w-100"></div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-2">
                    <div class="row g-0">
                        <div id="modalContentColumn" class="col-12 d-flex flex-column p-3">
                            <div class="post-text-content mb-3">
                                <h4 id="modalPostTitle" class="fw-bold mb-2 post-title-display"></h4>
                                <div id="modalPostTags" class="mb-3 d-flex flex-wrap gap-2 text-muted small" style="font-size: 0.8rem; display: none;"></div>
                                <div id="modalPostContent" class="text-muted mb-3" style="white-space: pre-wrap; font-size: 0.95rem;"></div>
                            </div>
                            
                            <div id="modalImageContainer" class="mb-3 text-center bg-light rounded" style="display: none; overflow: hidden;">
                                <img id="modalPostImage" src="" alt="Post" class="img-fluid rounded shadow-sm" style="max-height: 450px; width: 100%; object-fit: contain;">
                            </div>

                            <div class="interaction-row d-flex gap-4 py-2 mb-2 border-top border-bottom">
                                <div class="interaction-btn d-flex align-items-center gap-2" id="modal-like-btn" style="cursor: pointer;">
                                    <i id="modal-heart-icon" class="fas fa-heart fs-5 text-danger"></i>
                                    <span id="modal-like-count" class="fw-bold small text-dark">0</span>
                                </div>
                                <div class="interaction-btn d-flex align-items-center gap-2" onclick="document.getElementById('modal-comment-input-field').focus()" style="cursor: pointer;">
                                    <i class="fas fa-comment fs-5 text-primary"></i>
                                    <span class="fw-bold small text-dark">Comment</span>
                                </div>
                            </div>

                            <div class="comment-thread-container p-3" style="background-color: #f8fafc; border-radius: 15px;">
                                <div id="modalCommentsList" class="mb-3" style="max-height: 350px; overflow-y: auto;">
                                </div>

                                <div class="comment-input-wrapper mt-3">
                                    <div class="comment-pill-container">
                                        <input type="text" id="modal-comment-input-field" class="comment-pill-input" placeholder="Join the discussion...">
                                        <button class="comment-pill-button" id="modal-comment-submit-btn">
                                            <i class="fas fa-paper-plane" id="comment-submit-icon"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Delete Confirm Modal (fixes deleteComment() TypeError) -->
    <div class="modal fade" id="nexusDeleteConfirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white)">
          <div class="modal-header border-0 text-white py-2 px-3" style="background: var(--nexus-teal)">
            <h6 class="modal-title fw-bold mb-0"><i class="fas fa-trash me-2"></i>Delete</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-2 px-3 text-center">
            <p id="nexusDeleteConfirmMessage" class="mb-0" style="font-size:0.9rem;"></p>
          </div>
          <div class="modal-footer border-0 justify-content-center gap-2 py-2">
            <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="nexusDeleteConfirmBtn" class="btn btn-danger btn-sm px-3">
              <i class="fas fa-trash me-1"></i>Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom Edit Comment Modal (fixes editComment() TypeError) -->
    <div class="modal fade" id="nexusEditCommentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content border-0 shadow-lg" style="background-color: var(--nexus-card-white)">
          <div class="modal-header border-0 text-white py-2 px-3" style="background: var(--nexus-teal)">
            <h6 class="modal-title fw-bold mb-0"><i class="fas fa-edit me-2"></i>Update your message</h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-2 px-3">
            <textarea class="form-control p-2" id="editCommentTextarea" rows="3" style="border-radius: 8px; resize: none; font-size: 0.9rem;"></textarea>
          </div>
          <div class="modal-footer border-0 justify-content-end gap-2 py-2">
            <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="button" id="editCommentSaveBtn" class="btn btn-sm px-3 text-white" style="background-color: #1a535c;">
              <i class="fas fa-paper-plane me-1"></i>Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/homesearch.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
