<!-- Logout Confirmation Modal -->
<div class="modal fade" id="nexusLogoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 360px;">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <div class="modal-header border-0 px-4 py-3 d-flex align-items-center justify-content-between" style="background-color: #1a535c;">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-sign-out-alt" style="color: #fff; font-size: 1rem;"></i>
          <span class="fw-bold text-white" style="font-family: 'Montserrat', sans-serif; font-size: 1rem;">Log Out</span>
        </div>
        <button type="button" class="btn p-0 lh-1" data-bs-dismiss="modal" style="color: #ffffffaa; font-size: 1.3rem; background: none; border: none;">&times;</button>
      </div>
      <div class="modal-body px-4 py-4 text-center" style="background: #fff;">
        <p class="mb-0 text-dark" style="font-size: 0.95rem; font-family: 'Inter', sans-serif; line-height: 1.5;">
          Are you sure you want to log out of <strong>NEXUSWrites</strong>?
        </p>
      </div>
      <div class="modal-footer border-0 px-4 pb-4 pt-0 d-flex gap-2 justify-content-center" style="background: #fff;">
        <button type="button" class="btn btn-outline-secondary px-4 rounded-3" data-bs-dismiss="modal"
                style="font-family: 'Inter', sans-serif; font-size: 0.875rem;">Cancel</button>
        <button type="button" class="btn px-4 rounded-3 text-white" onclick="logoutUser()"
                style="background-color: #1a535c; font-family: 'Inter', sans-serif; font-size: 0.875rem;">
          <i class="fas fa-sign-out-alt me-1"></i> Log Out
        </button>
      </div>
    </div>
  </div>
